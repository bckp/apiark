[package]
name = "apiark-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared ApiArk collection, HTTP and scripting runtime"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
url = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
regex = "1"
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
rquickjs = { version = "0.9", features = ["parallel"] }
dirs = "5"
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2"
hmac = "0.12"
jsonwebtoken = "9"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
cookie = "0.18"
psl = "2"
csv = "1"
cap-std = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
tempfile = "3"
axum = "0.7"
futures-util = "0.3"
