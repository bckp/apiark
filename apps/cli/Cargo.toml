[package]
name = "apiark-cli"
version = "0.2.1"
description = "ApiArk CLI — run collections from the command line"
authors = ["ApiArk Contributors"]
edition = "2021"

[[bin]]
name = "apiark"
path = "src/main.rs"

[dependencies]
apiark-core = { path = "../../crates/apiark-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
colored = "2"

[dev-dependencies]
tempfile = "3"
axum = "0.7"
