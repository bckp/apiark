[package]
name = "apiark"
version = "0.4.7"
description = "Local-first API development platform"
authors = ["ApiArk Contributors"]
edition = "2021"

[lib]
name = "apiark_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "apiark"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
apiark-core = { path = "../../../crates/apiark-core" }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
url = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "io-util", "net", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5"
axum = "0.7"
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2"
notify = { version = "7", features = ["macos_fsevent"] }
notify-debouncer-mini = "0.5"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]

[[bench]]
name = "interpolation"
harness = false

[[bench]]
name = "collection_loading"
harness = false

[[bench]]
name = "curl_parsing"
harness = false

[[bench]]
name = "scripting"
harness = false

[[bench]]
name = "assertions"
harness = false
