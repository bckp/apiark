name: Signed macOS release

on:
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create a draft release after both signed builds pass
        type: boolean
        default: false

permissions:
  contents: read
  checks: read

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: macos-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: fish --no-config {0}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Fish
        shell: sh
        run: brew install fish
      - name: Require passing CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -l ci_result (gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=CI%20required&filter=latest" --jq '.check_runs[] | select(.app.slug == "github-actions") | [.status, .conclusion] | @tsv'); or exit 1
          if not contains -- (printf 'completed\tsuccess') $ci_result
              printf 'CI required must pass for this commit before signing.\n' >&2
              exit 1
          end
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: signed-macos-${{ matrix.arch }}
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Check the native build and shared runtime before signing
        run: fish scripts/check.fish
      - name: Read and validate release version
        id: version
        run: |
          set -l release_version (python3 -c 'import json; print(json.load(open("apps/desktop/src-tauri/tauri.conf.json"))["version"])')
          string match -rq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' -- "$release_version"; or exit 1
          printf 'version=%s\n' "$release_version" >> "$GITHUB_OUTPUT"
      - name: Require signing and notarization configuration
        env: &apple_credentials
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          for release_setting in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
              if not set -q $release_setting; or test -z "$$release_setting"
                  printf 'Missing release setting: %s\n' "$release_setting" >&2
                  exit 1
              end
          end
          string match -q 'Developer ID Application:*' -- "$APPLE_SIGNING_IDENTITY"; or exit 1
      - name: Build, sign and notarize
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env: *apple_credentials
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }} --bundles app,dmg --ci
      - name: Verify the distributed app and package it after stapling
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -l release_app "target/$RELEASE_TARGET/release/bundle/macos/ApiArk.app"
          set -l expected_identifier (python3 -c 'import json; print(json.load(open("apps/desktop/src-tauri/tauri.conf.json"))["identifier"])'); or exit 1
          set -l bundled_identifier (/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$release_app/Contents/Info.plist"); or exit 1
          test "$bundled_identifier" = "$expected_identifier"; or exit 1
          set -l expected_name (python3 -c 'import json; print(json.load(open("apps/desktop/src-tauri/tauri.conf.json"))["productName"])'); or exit 1
          set -l bundled_name (/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$release_app/Contents/Info.plist"); or exit 1
          test "$bundled_name" = "$expected_name"; or exit 1
          set -l bundled_version (/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$release_app/Contents/Info.plist")
          test "$bundled_version" = "$RELEASE_VERSION"; or exit 1
          set -l expected_arch (string replace x64 x86_64 -- "$RELEASE_ARCH")
          test (lipo -archs "$release_app/Contents/MacOS/apiark") = "$expected_arch"; or exit 1
          codesign --verify --deep --strict --verbose=2 "$release_app"; or exit 1
          set -l release_signature (codesign -dv --verbose=4 "$release_app" 2>&1)
          string match -rq '^Authority=Developer ID Application:' -- $release_signature; or exit 1
          contains -- "TeamIdentifier=$APPLE_TEAM_ID" $release_signature; or exit 1
          string match -rq 'flags=.*runtime' -- $release_signature; or exit 1
          xcrun stapler validate "$release_app"; or exit 1
          spctl --assess --type execute --verbose=2 "$release_app"; or exit 1
          test -f "$release_app/Contents/Resources/LICENSE"; or exit 1
          cmp LICENSE "$release_app/Contents/Resources/LICENSE"; or exit 1
          mkdir -p release-artifacts; or exit 1
          ditto -c -k --keepParent "$release_app" "release-artifacts/ApiArk-$RELEASE_VERSION-macos-$RELEASE_ARCH.app.zip"; or exit 1
      - name: Notarize the signed DMG and attach its ticket
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -l release_images target/$RELEASE_TARGET/release/bundle/dmg/*.dmg
          test (count $release_images) -eq 1; or exit 1
          set -l release_dmg $release_images[1]
          codesign --verify --strict --verbose=2 "$release_dmg"; or exit 1
          set -l image_signature (codesign -dv --verbose=4 "$release_dmg" 2>&1)
          string match -rq '^Authority=Developer ID Application:' -- $image_signature; or exit 1
          contains -- "TeamIdentifier=$APPLE_TEAM_ID" $image_signature; or exit 1
          set -lx NOTARY_RESULT "release-artifacts/dmg-notarization-$RELEASE_ARCH.json"
          xcrun notarytool submit "$release_dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --timeout 30m --output-format json > "$NOTARY_RESULT"; or exit 1
          python3 -c 'import json, os; assert json.load(open(os.environ["NOTARY_RESULT"]))["status"] == "Accepted"'; or exit 1
          xcrun stapler staple "$release_dmg"; or exit 1
          xcrun stapler validate "$release_dmg"; or exit 1
          codesign --verify --strict --verbose=2 "$release_dmg"; or exit 1
          spctl --assess --type open --context context:primary-signature --verbose=2 "$release_dmg"; or exit 1
          hdiutil verify "$release_dmg"; or exit 1
          cp "$release_dmg" "release-artifacts/ApiArk-$RELEASE_VERSION-macos-$RELEASE_ARCH.dmg"; or exit 1
          cd release-artifacts; or exit 1
          shasum -a 256 *.app.zip *.dmg > "SHA256SUMS-$RELEASE_ARCH.txt"; or exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-macos-${{ matrix.arch }}
          path: release-artifacts/*
          if-no-files-found: error

  draft:
    if: inputs.create_draft && needs.build.result == 'success'
    needs: build
    runs-on: macos-15
    permissions:
      contents: write
    defaults:
      run:
        shell: fish --no-config {0}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Fish
        shell: sh
        run: brew install fish
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: signed-macos-*
          merge-multiple: true
          path: release-artifacts
      - name: Create a draft; public publication is a separate action
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -l release_tag "v$RELEASE_VERSION"
          set -l matching_tag (gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$release_tag" --jq '.[] | select(.ref == "refs/tags/v" + env.RELEASE_VERSION) | .ref'); or exit 1
          if test -n "$matching_tag"
              set -l tagged_commit (gh api "repos/$GITHUB_REPOSITORY/commits/$release_tag" --jq .sha); or exit 1
              if test "$tagged_commit" != "$GITHUB_SHA"
                  printf 'Tag %s points to another commit; bump the fork version before releasing.\n' "$release_tag" >&2
                  exit 1
              end
          end
          set -l release_apps release-artifacts/*.app.zip
          set -l release_images release-artifacts/*.dmg
          set -l release_hashes release-artifacts/SHA256SUMS-*.txt
          test (count $release_apps) -eq 2; or exit 1
          test (count $release_images) -eq 2; or exit 1
          test (count $release_hashes) -eq 2; or exit 1
          gh release create "$release_tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "ApiArk $RELEASE_VERSION" --notes 'Signed and notarized macOS builds. Build and compatibility details are in README.md. Automatic updates are disabled.' $release_apps $release_images $release_hashes; or exit 1
